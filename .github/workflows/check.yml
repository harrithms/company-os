name: check
on:
  push:
  pull_request:

# The files are the database, so a malformed file is a broken database. This runs on every change
# so that anyone who forks this gets the same guarantee without setting anything up.
jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check.mjs
